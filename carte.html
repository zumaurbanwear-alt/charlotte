<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Carte</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
<link rel="apple-touch-icon" href="favicon_io/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1C1410;--bg2:#231A13;--bg3:#2E2018;
  --cream:#F2EAD8;--cream2:#D9CEBC;
  --brown:#7A7870;--brown-light:#D4C9B0;
  --text:#F2EAD8;--muted:#8A8880;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden;}

/* NAV */
nav{position:fixed;top:0;left:0;width:100%;z-index:50;padding:1.2rem 2.5rem;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(28,20,16,0.95),transparent);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:0.75rem;letter-spacing:0.3em;color:var(--brown-light);text-decoration:none;opacity:0.8;}
.nav-back{font-family:'Bebas Neue',sans-serif;font-size:0.65rem;letter-spacing:0.35em;color:var(--muted);text-decoration:none;transition:color 0.2s;}
.nav-back:hover{color:var(--cream);}
.nav-add-btn{font-family:'Bebas Neue',sans-serif;font-size:0.65rem;letter-spacing:0.3em;color:var(--muted);background:none;border:1px solid rgba(180,170,155,0.2);padding:0.4rem 1rem;cursor:pointer;transition:all 0.2s;}
.nav-add-btn:hover,.nav-add-btn.active{color:var(--cream);border-color:rgba(180,170,155,0.5);}

/* MAP CONTAINER */
#map-wrap{position:fixed;inset:0;z-index:1;overflow:hidden;}
#map-svg{width:100%;height:100%;cursor:default;}
#map-svg.adding{cursor:crosshair;}

/* CARTE TITLE */
.map-title{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none;}
.map-title h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(1rem,3vw,1.4rem);letter-spacing:0.4em;color:var(--cream);opacity:0.15;}

/* ADD MODE HINT */
#add-hint{position:fixed;top:5rem;left:50%;transform:translateX(-50%);z-index:20;font-family:'Bebas Neue',sans-serif;font-size:0.65rem;letter-spacing:0.4em;color:var(--brown-light);opacity:0.8;background:rgba(28,20,16,0.9);padding:0.5rem 1.2rem;border:1px solid rgba(180,170,155,0.2);display:none;}
#add-hint.show{display:block;}

/* PIN POPUP */
#pin-popup{
  position:fixed;z-index:100;
  background:var(--bg2);
  border:1px solid rgba(180,170,155,0.22);
  padding:1.5rem;
  width:260px;
  display:none;
  pointer-events:all;
}
#pin-popup.show{display:block;}
.popup-name{font-family:'Bebas Neue',sans-serif;font-size:0.8rem;letter-spacing:0.3em;color:var(--brown-light);margin-bottom:0.3rem;}
.popup-text{font-size:0.95rem;font-style:italic;color:var(--cream2);line-height:1.7;font-weight:300;}
.popup-delete{font-family:'Bebas Neue',sans-serif;font-size:0.55rem;letter-spacing:0.3em;color:var(--muted);background:none;border:none;cursor:pointer;margin-top:1rem;display:block;transition:color 0.2s;}
.popup-delete:hover{color:var(--cream);}
.popup-close{position:absolute;top:0.6rem;right:0.8rem;font-family:'Bebas Neue',sans-serif;font-size:0.6rem;color:var(--muted);background:none;border:none;cursor:pointer;}
.popup-close:hover{color:var(--cream);}

/* ADD FORM MODAL */
#add-modal{
  position:fixed;inset:0;z-index:200;
  background:rgba(10,7,4,0.88);
  backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;
  padding:2rem;
}
#add-modal.show{display:flex;}
#add-form{
  background:var(--bg2);
  border:1px solid rgba(180,170,155,0.2);
  padding:2.5rem;
  width:100%;max-width:400px;
}
.form-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:0.3em;color:var(--cream);margin-bottom:2rem;}
.form-group{margin-bottom:1.2rem;}
.form-label{font-family:'Bebas Neue',sans-serif;font-size:0.6rem;letter-spacing:0.4em;color:var(--muted);opacity:0.7;display:block;margin-bottom:0.5rem;}
.form-input,.form-textarea{
  width:100%;background:rgba(255,255,255,0.03);
  border:none;border-bottom:1px solid rgba(180,170,155,0.2);
  padding:0.5rem 0.2rem;color:var(--cream);
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:1rem;outline:none;transition:border-color 0.2s;
}
.form-textarea{resize:none;height:80px;border:1px solid rgba(180,170,155,0.2);padding:0.5rem;margin-top:0.2rem;}
.form-input::placeholder,.form-textarea::placeholder{color:var(--muted);opacity:0.4;}
.form-input:focus,.form-textarea:focus{border-color:rgba(180,170,155,0.5);}
.form-actions{display:flex;gap:1rem;margin-top:2rem;}
.form-submit{font-family:'Bebas Neue',sans-serif;font-size:0.7rem;letter-spacing:0.4em;color:var(--cream);background:none;border:1px solid rgba(180,170,155,0.3);padding:0.7rem 1.5rem;cursor:pointer;transition:all 0.2s;flex:1;}
.form-submit:hover{background:rgba(180,170,155,0.08);border-color:rgba(180,170,155,0.6);}
.form-cancel{font-family:'Bebas Neue',sans-serif;font-size:0.7rem;letter-spacing:0.4em;color:var(--muted);background:none;border:none;cursor:pointer;padding:0.7rem 1rem;transition:color 0.2s;}
.form-cancel:hover{color:var(--cream);}

/* STARFIELD */
#starfield{position:fixed;inset:0;pointer-events:none;z-index:0;}
</style>
</head>

  <button class="popup-delete" id="popup-delete">✕ Supprimer ce lieu</button>

<!-- MODAL AJOUT -->
<div id="add-modal">
  <div id="add-form">
    <p class="form-title">Nouveau lieu ✦</p>
    <div class="form-group">
      <label class="form-label">Nom du lieu</label>

    </div>
    <div class="form-group">
      <label class="form-label">Note (optionnel)</label>
      <textarea class="form-textarea" id="form-text" placeholder="Un souvenir, une anecdote..."></textarea>
    </div>
    <div class="form-actions">
      <button class="form-submit" id="form-submit">Placer ✦</button>
      <button class="form-cancel" id="form-cancel">Annuler</button>
    </div>
  </div>
</div>

<div class="map-title"><h1>NOTRE CASABLANCA</h1></div>

<script>
const PINS_KEY = 'charlotte_carte_pins';

// STARFIELD
const cv = document.createElement('canvas');
cv.id = 'starfield';
cv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:0;';
document.body.prepend(cv);
const cx = cv.getContext('2d');
let ST = [];
function rsz(){ cv.width = innerWidth; cv.height = innerHeight; }
function mkStars(){
  ST = [];
  for(let i=0;i<120;i++){
    ST.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*0.8+0.1,a:Math.random()*Math.PI*2,sp:(Math.random()*0.001+0.0003)*(Math.random()<0.5?1:-1),maxA:Math.random()*0.3+0.05});
  }
}
function drawStars(){
  cx.clearRect(0,0,cv.width,cv.height);
  ST.forEach(s=>{s.a+=s.sp;const al=(Math.sin(s.a)*0.5+0.5)*s.maxA+0.02;cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fillStyle=`rgba(235,232,228,${al})`;cx.fill();});
  requestAnimationFrame(drawStars);
}
rsz();mkStars();drawStars();
window.addEventListener('resize',()=>{rsz();mkStars();});

// PINS DATA
// Coordonnées SVG (viewBox 1000x800)
// Dar Bouazza: zone sud-ouest côtière ~ x:185, y:620
// Fac Taieb Naciri: Hay Hassani ~ x:360, y:498
// Plage Madame Choual: côte ~ x:122, y:490
// Pathé: Maarif ~ x:335, y:342

let pins = [];
try { const s = localStorage.getItem(PINS_KEY); if(s) pins = JSON.parse(s); } catch(e){}

// Pins de départ (ajoutés si vide)
const defaultPins = [
  { id: 'p0', x: 185, y: 625, name: 'Chez Charlotte', text: '', fixed: true },
  { id: 'p1', x: 360, y: 498, name: 'La grande fac', text: '', fixed: true },
  { id: 'p2', x: 122, y: 488, name: 'Notre spot', text: '', fixed: true },
  { id: 'p3', x: 335, y: 342, name: 'Pathé', text: '', fixed: true },
  { id: 'p4', x: 468, y: 358, name: 'Billard', text: '', fixed: true },
  { id: 'p5', x: 248, y: 325, name: 'Anfa Park', text: '', fixed: true },
];
const existingIds = pins.map(p => p.id);
const missingDefaults = defaultPins.filter(p => !existingIds.includes(p.id));
if(pins.length === 0){
  pins = [...defaultPins];
} else if(missingDefaults.length > 0){
  pins = [...missingDefaults, ...pins];
}
savePins();

function savePins(){ localStorage.setItem(PINS_KEY, JSON.stringify(pins)); }

// RENDER PINS
const pinsLayer = document.getElementById('pins-layer');
const svg = document.getElementById('map-svg');

function renderPins(){
  pinsLayer.innerHTML = '';
  pins.forEach((p, idx) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','pin-group');
    g.style.cursor = 'pointer';

    // Pin shadow
    const shadow = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    shadow.setAttribute('cx', p.x);
    shadow.setAttribute('cy', p.y + 2);
    shadow.setAttribute('rx', '5');
    shadow.setAttribute('ry', '2');
    shadow.setAttribute('fill','rgba(0,0,0,0.3)');
    g.appendChild(shadow);

    // Pin body (épingle)
    const pinBody = document.createElementNS('http://www.w3.org/2000/svg','path');
    // Forme d'épingle : cercle en haut, pointe en bas
    const px = p.x, py = p.y;
    pinBody.setAttribute('d', `M${px},${py-18} m-6,0 a6,6 0 1,1 12,0 Q${px+6},${py-8} ${px},${py} Q${px-6},${py-8} ${px-6},${py-12} Z`);
    pinBody.setAttribute('fill','rgba(212,201,176,0.85)');
    pinBody.setAttribute('stroke','rgba(212,201,176,1)');
    pinBody.setAttribute('stroke-width','0.5');
    g.appendChild(pinBody);

    // Point central du pin
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx', px);
    dot.setAttribute('cy', py - 18);
    dot.setAttribute('r', '2.5');
    dot.setAttribute('fill','rgba(28,20,16,0.8)');
    g.appendChild(dot);

    // Label
    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', px + 10);
    label.setAttribute('y', py - 14);
    label.setAttribute('font-family',"'Bebas Neue',sans-serif");
    label.setAttribute('font-size','8');
    label.setAttribute('fill','rgba(212,201,176,0.7)');
    label.setAttribute('letter-spacing','1');
    label.textContent = p.name.toUpperCase().substring(0,22) + (p.name.length > 22 ? '...' : '');
    g.appendChild(label);

    g.addEventListener('click', (e) => { e.stopPropagation(); showPopup(p, idx, e); });
    pinsLayer.appendChild(g);
  });
}
renderPins();

// POPUP
const popup = document.getElementById('pin-popup');
const popupName = document.getElementById('popup-name');
const popupText = document.getElementById('popup-text');
const popupDelete = document.getElementById('popup-delete');
const popupClose = document.getElementById('popup-close');
let activeIdx = -1;

function showPopup(p, idx, e){
  activeIdx = idx;
  popupName.textContent = p.name;
  popupText.textContent = p.text || '— aucune note —';
  // Position
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = e.clientX + 15, top = e.clientY - 20;
  if(left + 280 > vw) left = e.clientX - 275;
  if(top + 150 > vh) top = vh - 160;
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
  popup.classList.add('show');
}
popupClose.addEventListener('click', () => popup.classList.remove('show'));
popupDelete.addEventListener('click', () => {
  if(activeIdx < 0) return;
  pins.splice(activeIdx, 1);
  savePins();
  renderPins();
  popup.classList.remove('show');
});
document.getElementById('map-wrap').addEventListener('click', () => popup.classList.remove('show'));

// ADD MODE
const addBtn = document.getElementById('nav-add-btn');
const addHint = document.getElementById('add-hint');
const addModal = document.getElementById('add-modal');
const formName = document.getElementById('form-name');
const formText = document.getElementById('form-text');
const formSubmit = document.getElementById('form-submit');
const formCancel = document.getElementById('form-cancel');
let addMode = false;
let pendingCoords = null;

addBtn.addEventListener('click', () => {
  addMode = !addMode;
  addBtn.classList.toggle('active', addMode);
  addHint.classList.toggle('show', addMode);
  svg.classList.toggle('adding', addMode);
});

svg.addEventListener('click', (e) => {
  if(!addMode) return;
  // Convertir coords écran → SVG viewBox
  const rect = svg.getBoundingClientRect();
  const scaleX = 1000 / rect.width;
  const scaleY = 800 / rect.height;
  const svgX = (e.clientX - rect.left) * scaleX;
  const svgY = (e.clientY - rect.top) * scaleY;
  pendingCoords = { x: Math.round(svgX), y: Math.round(svgY) };
  formName.value = '';
  formText.value = '';
  addModal.classList.add('show');
  setTimeout(() => formName.focus(), 100);
});

formSubmit.addEventListener('click', () => {
  const name = formName.value.trim();
  if(!name || !pendingCoords) return;
  pins.push({ id: 'p'+ Date.now(), x: pendingCoords.x, y: pendingCoords.y, name, text: formText.value.trim() });
  savePins();
  renderPins();
  addModal.classList.remove('show');
  addMode = false;
  addBtn.classList.remove('active');
  addHint.classList.remove('show');
  svg.classList.remove('adding');
});

formCancel.addEventListener('click', () => { addModal.classList.remove('show'); });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ addModal.classList.remove('show'); popup.classList.remove('show'); }});
</script>
</body>
</html>
