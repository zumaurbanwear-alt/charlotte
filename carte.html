<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Carte</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
<link rel="apple-touch-icon" href="favicon_io/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1C1410;--bg2:#231A13;
  --cream:#F2EAD8;--cream2:#D9CEBC;
  --brown:#7A7870;--brown-light:#D4C9B0;
  --text:#F2EAD8;--muted:#8A8880;
}
html,body{height:100%;width:100%;background:#0D0F14;color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden;}

nav{position:fixed;top:0;left:0;width:100%;z-index:50;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(13,15,20,0.95),transparent);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:0.75rem;letter-spacing:0.3em;color:var(--brown-light);text-decoration:none;opacity:0.8;}
.nav-back{font-family:'Bebas Neue',sans-serif;font-size:0.6rem;letter-spacing:0.3em;color:var(--muted);text-decoration:none;transition:color 0.2s;}
.nav-back:hover{color:var(--cream);}
.nav-add-btn{font-family:'Bebas Neue',sans-serif;font-size:0.6rem;letter-spacing:0.25em;color:var(--muted);background:none;border:1px solid rgba(180,170,155,0.2);padding:0.35rem 0.8rem;cursor:pointer;transition:all 0.2s;}
.nav-add-btn:hover,.nav-add-btn.active{color:var(--cream);border-color:rgba(180,170,155,0.5);}

#map-wrap{position:fixed;inset:0;z-index:1;}
#map-svg{width:100%;height:100%;display:block;}
#map-svg.adding{cursor:crosshair;}

.map-title{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none;}
.map-title h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(0.8rem,2.5vw,1.2rem);letter-spacing:0.4em;color:var(--cream);opacity:0.12;}

#add-hint{position:fixed;top:4.5rem;left:50%;transform:translateX(-50%);z-index:20;font-family:'Bebas Neue',sans-serif;font-size:0.6rem;letter-spacing:0.35em;color:var(--brown-light);opacity:0.85;background:rgba(13,15,20,0.92);padding:0.45rem 1rem;border:1px solid rgba(180,170,155,0.2);display:none;white-space:nowrap;}
#add-hint.show{display:block;}

#pin-popup{position:fixed;z-index:100;background:var(--bg2);border:1px solid rgba(180,170,155,0.22);padding:1.2rem;width:230px;display:none;}
#pin-popup.show{display:block;}
.popup-name{font-family:'Bebas Neue',sans-serif;font-size:0.75rem;letter-spacing:0.25em;color:var(--brown-light);margin-bottom:0.3rem;}
.popup-text{font-size:0.9rem;font-style:italic;color:var(--cream2);line-height:1.65;font-weight:300;}
.popup-delete{font-family:'Bebas Neue',sans-serif;font-size:0.5rem;letter-spacing:0.25em;color:var(--muted);background:none;border:none;cursor:pointer;margin-top:0.8rem;display:block;transition:color 0.2s;}
.popup-delete:hover{color:var(--cream);}
.popup-close{position:absolute;top:0.5rem;right:0.7rem;font-family:'Bebas Neue',sans-serif;font-size:0.55rem;color:var(--muted);background:none;border:none;cursor:pointer;}
.popup-close:hover{color:var(--cream);}

#add-modal{position:fixed;inset:0;z-index:200;background:rgba(10,7,4,0.9);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:1.5rem;}
#add-modal.show{display:flex;}
#add-form{background:var(--bg2);border:1px solid rgba(180,170,155,0.2);padding:2rem;width:100%;max-width:380px;}
.form-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.3em;color:var(--cream);margin-bottom:1.5rem;}
.form-group{margin-bottom:1rem;}
.form-label{font-family:'Bebas Neue',sans-serif;font-size:0.55rem;letter-spacing:0.4em;color:var(--muted);opacity:0.7;display:block;margin-bottom:0.4rem;}
.form-input,.form-textarea{width:100%;background:rgba(255,255,255,0.03);border:none;border-bottom:1px solid rgba(180,170,155,0.2);padding:0.45rem 0.2rem;color:var(--cream);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;outline:none;transition:border-color 0.2s;}
.form-textarea{resize:none;height:70px;border:1px solid rgba(180,170,155,0.2);padding:0.4rem;margin-top:0.2rem;}
.form-input::placeholder,.form-textarea::placeholder{color:var(--muted);opacity:0.4;}
.form-input:focus,.form-textarea:focus{border-color:rgba(180,170,155,0.5);}
.form-actions{display:flex;gap:1rem;margin-top:1.5rem;}
.form-submit{font-family:'Bebas Neue',sans-serif;font-size:0.65rem;letter-spacing:0.35em;color:var(--cream);background:none;border:1px solid rgba(180,170,155,0.3);padding:0.6rem 1.2rem;cursor:pointer;transition:all 0.2s;flex:1;}
.form-submit:hover{background:rgba(180,170,155,0.08);border-color:rgba(180,170,155,0.6);}
.form-cancel{font-family:'Bebas Neue',sans-serif;font-size:0.65rem;letter-spacing:0.35em;color:var(--muted);background:none;border:none;cursor:pointer;padding:0.6rem 0.8rem;transition:color 0.2s;}
.form-cancel:hover{color:var(--cream);}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">✦ Explorer</a>
  <div style="display:flex;gap:1rem;align-items:center;">

  <rect x="15" y="800" width="155" height="82" rx="2" fill="rgba(13,15,20,0.78)" stroke="rgba(180,170,155,0.12)" stroke-width="0.5"/>
  <text x="25" y="820" font-family="'Bebas Neue',sans-serif" font-size="7" fill="rgba(212,201,176,0.4)" letter-spacing="2.5">CASABLANCA</text>
  <line x1="25" y1="826" x2="160" y2="826" stroke="rgba(180,170,155,0.15)" stroke-width="0.5"/>
  <line x1="25" y1="840" x2="52" y2="840" stroke="rgba(212,201,176,0.28)" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="58" y="843" font-family="'Cormorant Garamond',serif" font-size="7.5" fill="rgba(212,201,176,0.3)" font-style="italic">Autoroute</text>
  <circle cx="32" cy="860" r="4" fill="rgba(212,201,176,0.55)" stroke="rgba(212,201,176,0.85)" stroke-width="0.8"/>
  <text x="42" y="863" font-family="'Cormorant Garamond',serif" font-size="7.5" fill="rgba(212,201,176,0.3)" font-style="italic">Nos lieux</text>
  <line x1="25" y1="872" x2="52" y2="872" stroke="rgba(212,201,176,0.15)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="58" y="875" font-family="'Cormorant Garamond',serif" font-size="7.5" fill="rgba(212,201,176,0.2)" font-style="italic">Périphérique</text>

  <!-- ── PINS DYNAMIQUES ── -->
  <g id="pins-layer"></g>

</svg>
</div>

<div class="map-title"><h1>NOTRE CASABLANCA</h1></div>

<!-- POPUP -->
<div id="pin-popup">
  <button class="popup-close" id="popup-close">✕</button>
  <p class="popup-name" id="popup-name"></p>
  <p class="popup-text" id="popup-text"></p>
  <button class="popup-delete" id="popup-delete">✕ Supprimer ce lieu</button>
</div>

<!-- MODAL AJOUT -->
<div id="add-modal">
  <div id="add-form">
    <p class="form-title">Nouveau lieu ✦</p>
    <div class="form-group">
      <label class="form-label">Nom du lieu</label>
      <input class="form-input" id="form-name" type="text" placeholder="ex: La plage, Chez toi..."/>
    </div>
    <div class="form-group">
      <label class="form-label">Note (optionnel)</label>
      <textarea class="form-textarea" id="form-text" placeholder="Un souvenir, une anecdote..."></textarea>
    </div>
    <div class="form-actions">
      <button class="form-submit" id="form-submit">Placer ✦</button>
      <button class="form-cancel" id="form-cancel">Annuler</button>
    </div>
  </div>
</div>

<script>
const PINS_KEY = 'charlotte_carte_pins';

// Starfield léger
const cv = document.createElement('canvas');
cv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:0;';
document.body.prepend(cv);
const cx2 = cv.getContext('2d'); let ST=[];
function rsz(){cv.width=innerWidth;cv.height=innerHeight;}
function mkS(){ST=[];for(let i=0;i<80;i++)ST.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*0.7+0.1,a:Math.random()*Math.PI*2,sp:(Math.random()*0.001+0.0002)*(Math.random()<0.5?1:-1),mA:Math.random()*0.25+0.04});}
function drawS(){cx2.clearRect(0,0,cv.width,cv.height);ST.forEach(s=>{s.a+=s.sp;const al=(Math.sin(s.a)*0.5+0.5)*s.mA+0.02;cx2.beginPath();cx2.arc(s.x,s.y,s.r,0,Math.PI*2);cx2.fillStyle=`rgba(235,232,228,${al})`;cx2.fill();});requestAnimationFrame(drawS);}
rsz();mkS();drawS();window.addEventListener('resize',()=>{rsz();mkS();});

// PINS
let pins=[];
try{const s=localStorage.getItem(PINS_KEY);if(s)pins=JSON.parse(s);}catch(e){}

// viewBox 800x900 — positions recalculées
const defaultPins=[
  {id:'p0',x:185,y:688,name:'Chez Charlotte',text:''},
  {id:'p1',x:328,y:572,name:'La grande fac',text:''},
  {id:'p2',x:122,y:555,name:'Notre spot',text:''},
  {id:'p3',x:655,y:382,name:'Pathé',text:''},
  {id:'p4',x:435,y:322,name:'Billard',text:''},
  {id:'p5',x:228,y:445,name:'Anfa Park',text:''},
];
const existingIds=pins.map(p=>p.id);
const missing=defaultPins.filter(p=>!existingIds.includes(p.id));
if(pins.length===0){pins=[...defaultPins];}else if(missing.length>0){pins=[...missing,...pins];}
savePins();
function savePins(){localStorage.setItem(PINS_KEY,JSON.stringify(pins));}

const pinsLayer=document.getElementById('pins-layer');
const svg=document.getElementById('map-svg');

function renderPins(){
  pinsLayer.innerHTML='';
  pins.forEach((p,idx)=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor='pointer';

    const sh=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    sh.setAttribute('cx',p.x);sh.setAttribute('cy',p.y+3);
    sh.setAttribute('rx','6');sh.setAttribute('ry','2.5');
    sh.setAttribute('fill','rgba(0,0,0,0.35)');
    g.appendChild(sh);

    const pin=document.createElementNS('http://www.w3.org/2000/svg','path');
    const px=p.x,py=p.y;
    pin.setAttribute('d',`M${px},${py-22} m-7,0 a7,7 0 1,1 14,0 Q${px+7},${py-10} ${px},${py} Q${px-7},${py-10} ${px-7},${py-15} Z`);
    pin.setAttribute('fill','rgba(212,201,176,0.88)');
    pin.setAttribute('stroke','rgba(242,234,216,0.9)');
    pin.setAttribute('stroke-width','0.5');
    g.appendChild(pin);

    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',px);dot.setAttribute('cy',py-22);
    dot.setAttribute('r','3');dot.setAttribute('fill','rgba(28,20,16,0.85)');
    g.appendChild(dot);

    const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('x',px+12);lbl.setAttribute('y',py-17);
    lbl.setAttribute('font-family',"'Bebas Neue',sans-serif");
    lbl.setAttribute('font-size','9');
    lbl.setAttribute('fill','rgba(212,201,176,0.75)');
    lbl.setAttribute('letter-spacing','1.5');
    lbl.textContent=p.name.toUpperCase().substring(0,20)+(p.name.length>20?'…':'');
    g.appendChild(lbl);

    g.addEventListener('click',e=>{e.stopPropagation();showPopup(p,idx,e);});
    pinsLayer.appendChild(g);
  });
}
renderPins();

const popup=document.getElementById('pin-popup');
const popupName=document.getElementById('popup-name');
const popupText=document.getElementById('popup-text');
const popupDelete=document.getElementById('popup-delete');
const popupClose=document.getElementById('popup-close');
let activeIdx=-1;

function showPopup(p,idx,e){
  activeIdx=idx;
  popupName.textContent=p.name;
  popupText.textContent=p.text||'— aucune note —';
  const vw=window.innerWidth,vh=window.innerHeight;
  let left=e.clientX+15,top=e.clientY-15;
  if(left+240>vw)left=e.clientX-245;
  if(top+140>vh)top=vh-148;
  popup.style.left=left+'px';popup.style.top=top+'px';
  popup.classList.add('show');
}
popupClose.addEventListener('click',()=>popup.classList.remove('show'));
popupDelete.addEventListener('click',()=>{
  if(activeIdx<0)return;
  pins.splice(activeIdx,1);savePins();renderPins();
  popup.classList.remove('show');
});
document.getElementById('map-wrap').addEventListener('click',()=>popup.classList.remove('show'));

const addBtn=document.getElementById('nav-add-btn');
const addHint=document.getElementById('add-hint');
const addModal=document.getElementById('add-modal');
const formName=document.getElementById('form-name');
const formText=document.getElementById('form-text');
const formSubmit=document.getElementById('form-submit');
const formCancel=document.getElementById('form-cancel');
let addMode=false,pendingCoords=null;

addBtn.addEventListener('click',()=>{
  addMode=!addMode;
  addBtn.classList.toggle('active',addMode);
  addHint.classList.toggle('show',addMode);
  svg.classList.toggle('adding',addMode);
});

svg.addEventListener('click',e=>{
  if(!addMode)return;
  const rect=svg.getBoundingClientRect();
  const svgX=(e.clientX-rect.left)*(800/rect.width);
  const svgY=(e.clientY-rect.top)*(900/rect.height);
  pendingCoords={x:Math.round(svgX),y:Math.round(svgY)};
  formName.value='';formText.value='';
  addModal.classList.add('show');
  setTimeout(()=>formName.focus(),100);
});

formSubmit.addEventListener('click',()=>{
  const name=formName.value.trim();
  if(!name||!pendingCoords)return;
  pins.push({id:'p'+Date.now(),x:pendingCoords.x,y:pendingCoords.y,name,text:formText.value.trim()});
  savePins();renderPins();
  addModal.classList.remove('show');
  addMode=false;addBtn.classList.remove('active');
  addHint.classList.remove('show');svg.classList.remove('adding');
});
formCancel.addEventListener('click',()=>addModal.classList.remove('show'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){addModal.classList.remove('show');popup.classList.remove('show');}});
</script>
</body>
</html>
