<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orphée & Eurydice</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
<link rel="apple-touch-icon" href="favicon_io/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1C1410;--bg2:#231A13;--cream:#F2EAD8;--cream2:#D9CEBC;--brown:#7A7870;--brown-light:#D4C9B0;--muted:#8A8880;}
html,body{min-height:100%;background:var(--bg);color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden;}
#starfield{position:fixed;inset:0;pointer-events:none;z-index:0;}
nav{position:fixed;top:0;left:0;width:100%;z-index:50;padding:1.2rem 2rem;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(28,20,16,0.95),transparent);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:0.75rem;letter-spacing:0.3em;color:var(--brown-light);text-decoration:none;opacity:0.8;}
.nav-back{font-family:'Bebas Neue',sans-serif;font-size:0.6rem;letter-spacing:0.35em;color:var(--muted);text-decoration:none;transition:color 0.2s;}
.nav-back:hover{color:var(--cream);}
#game{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6rem 2rem 5rem;max-width:600px;margin:0 auto;text-align:center;}
.illustration{width:200px;height:160px;margin-bottom:2.5rem;opacity:0;transform:translateY(8px);transition:opacity 1s ease 0.2s,transform 1s ease 0.2s;}
.illustration.show{opacity:1;transform:translateY(0);}
.act-tag{font-family:'Bebas Neue',sans-serif;font-size:0.6rem;letter-spacing:0.6em;color:var(--brown-light);opacity:0.45;margin-bottom:2rem;}
.narration{font-size:clamp(1.05rem,2.8vw,1.35rem);font-style:italic;font-weight:300;line-height:2;color:var(--cream);margin-bottom:2.8rem;opacity:0;transform:translateY(10px);transition:opacity 0.9s ease 0.4s,transform 0.9s ease 0.4s;}
.narration.show{opacity:1;transform:translateY(0);}
.narration em{color:var(--brown-light);font-style:normal;}
.choices{display:flex;flex-direction:column;gap:0.9rem;width:100%;max-width:400px;opacity:0;transition:opacity 0.6s ease 0.9s;}
.choices.show{opacity:1;}
.choice-btn{background:none;border:1px solid rgba(180,170,155,0.2);padding:0.9rem 1.4rem;color:var(--cream2);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(0.95rem,2vw,1.05rem);font-weight:300;line-height:1.6;cursor:pointer;transition:all 0.3s;text-align:center;}
.choice-btn:hover{background:rgba(180,170,155,0.07);border-color:rgba(212,201,176,0.45);color:var(--cream);}
/* ENDING */
.ending{opacity:0;transform:translateY(14px);transition:opacity 1.2s ease,transform 1.2s ease;display:none;width:100%;}
.ending.show{opacity:1;transform:translateY(0);}
.ending-illus{width:200px;height:160px;margin:0 auto 2.5rem;display:block;}
.ending-label{font-family:'Bebas Neue',sans-serif;font-size:0.6rem;letter-spacing:0.6em;color:var(--brown-light);opacity:0.4;margin-bottom:1rem;}
.ending-type{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:clamp(0.85rem,2vw,1rem);color:var(--brown-light);opacity:0.75;margin-bottom:2rem;letter-spacing:0.05em;}
.ending-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:clamp(1.8rem,6vw,3rem);color:var(--cream);line-height:1.1;margin-bottom:2rem;}
.ending-text{font-size:clamp(1rem,2.3vw,1.2rem);font-style:italic;font-weight:300;line-height:2.1;color:var(--cream2);opacity:0.88;margin-bottom:1.8rem;}
.ending-text em{color:var(--brown-light);font-style:normal;}
.ending-sig{font-family:'Bebas Neue',sans-serif;font-size:0.62rem;letter-spacing:0.5em;color:var(--brown-light);opacity:0.4;margin-bottom:2rem;}
.ending-btns{display:flex;flex-direction:column;gap:0.8rem;align-items:center;margin-bottom:3rem;}
.ending-btn{font-family:'Bebas Neue',sans-serif;font-size:0.62rem;letter-spacing:0.4em;color:var(--muted);background:none;border:1px solid rgba(180,170,155,0.18);padding:0.65rem 1.6rem;cursor:pointer;transition:all 0.3s;}
.ending-btn:hover{color:var(--cream);border-color:rgba(180,170,155,0.5);}
/* SCORE PANEL */
#score-panel{display:none;margin-bottom:2.5rem;border:1px solid rgba(180,170,155,0.12);padding:2rem;max-width:400px;width:100%;text-align:left;}
#score-panel.show{display:block;}
.score-title{font-family:'Bebas Neue',sans-serif;font-size:0.65rem;letter-spacing:0.5em;color:var(--brown-light);opacity:0.5;margin-bottom:1.5rem;text-align:center;}
.score-row{margin-bottom:1.2rem;}
.score-label{font-family:'Bebas Neue',sans-serif;font-size:0.58rem;letter-spacing:0.35em;color:var(--muted);opacity:0.7;display:block;margin-bottom:0.4rem;}
.score-bar-wrap{height:1px;background:rgba(180,170,155,0.1);position:relative;margin-bottom:0.5rem;}
.score-bar{height:1px;background:rgba(212,201,176,0.5);transition:width 1s ease;}
.score-val{font-size:0.8rem;font-style:italic;color:var(--cream2);opacity:0.7;}
.score-philosophy{margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid rgba(180,170,155,0.1);font-size:0.95rem;font-style:italic;color:var(--cream2);line-height:1.8;opacity:0.85;}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<nav>
  <a class="nav-logo" href="index.html">&#10022; Explorer</a>
  <a class="nav-back" href="index.html">&larr; Retour</a>
</nav>
<div id="game">
  <div class="illustration" id="illustration"></div>
  <p class="act-tag" id="act-tag"></p>
  <p class="narration" id="narration"></p>
  <div class="choices" id="choices"></div>
  <div class="ending" id="ending">
    <canvas class="ending-illus" id="ending-canvas" width="200" height="160"></canvas>
    <p class="ending-label" id="ending-label"></p>
    <p class="ending-type" id="ending-type"></p>
    <h2 class="ending-title" id="ending-title"></h2>
    <p class="ending-text" id="ending-text"></p>
    <p class="ending-sig">Lily &#10022;</p>
    <div id="score-panel">
      <p class="score-title">Pourquoi cette fin</p>
      <div class="score-row">
        <span class="score-label">Courage</span>
        <div class="score-bar-wrap"><div class="score-bar" id="bar-courage"></div></div>
        <span class="score-val" id="val-courage"></span>
      </div>
      <div class="score-row">
        <span class="score-label">Confiance</span>
        <div class="score-bar-wrap"><div class="score-bar" id="bar-confiance"></div></div>
        <span class="score-val" id="val-confiance"></span>
      </div>
      <div class="score-row">
        <span class="score-label">Lâcher-prise</span>
        <div class="score-bar-wrap"><div class="score-bar" id="bar-lacher"></div></div>
        <span class="score-val" id="val-lacher"></span>
      </div>
      <p class="score-philosophy" id="score-philosophy"></p>
    </div>
    <div class="ending-btns">
      <button class="ending-btn" id="why-btn">✦ &nbsp; Pourquoi cette fin ?</button>
      <button class="ending-btn" id="restart-btn">Recommencer &#8635;</button>
    </div>
  </div>
</div>
<script>
// STARFIELD
var cv=document.getElementById('starfield'),cx=cv.getContext('2d'),ST=[];
function rsz(){cv.width=innerWidth;cv.height=Math.max(document.body.scrollHeight,innerHeight);}
function mkS(){ST=[];for(var i=0;i<180;i++){var l=Math.random()<0.7?0:Math.random()<0.7?1:2;var r=l===0?Math.random()*0.35+0.1:l===1?Math.random()*0.55+0.3:Math.random()*0.85+0.5;var mA=l===0?0.2:l===1?0.38:0.62;ST.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:r,a:Math.random()*Math.PI*2,sp:(Math.random()*0.0015+0.0003)*(Math.random()<0.5?1:-1),mA:mA});}}
function drawS(){cx.clearRect(0,0,cv.width,cv.height);ST.forEach(function(s){s.a+=s.sp;var al=(Math.sin(s.a)*0.5+0.5)*s.mA+0.02;cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fillStyle='rgba(235,232,228,'+al+')';cx.fill();});requestAnimationFrame(drawS);}
rsz();mkS();drawS();window.addEventListener('resize',function(){rsz();mkS();});

// CANVAS ILLUSTRATIONS
function makeCanvas(drawFn){
  var c=document.createElement('canvas');c.width=200;c.height=160;c.style.width='100%';c.style.height='100%';
  var ctx=c.getContext('2d');var t=0;var active=true;
  function loop(){if(!active)return;ctx.clearRect(0,0,200,160);drawFn(ctx,t);t++;requestAnimationFrame(loop);}
  loop();c._stop=function(){active=false;};return c;
}

function drawLyre(ctx,t){
  var col='rgba(212,201,176,';
  var glow=0.04+0.02*Math.sin(t*0.02);
  ctx.beginPath();ctx.ellipse(100,80,38,42,0,0,Math.PI*2);ctx.fillStyle=col+glow+')';ctx.fill();
  ctx.beginPath();ctx.moveTo(70,60);ctx.bezierCurveTo(60,80,60,100,70,105);ctx.bezierCurveTo(82,130,118,130,130,105);ctx.bezierCurveTo(140,100,140,80,130,60);ctx.strokeStyle=col+'0.35)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(72,65);ctx.bezierCurveTo(68,45,80,30,100,30);ctx.strokeStyle=col+'0.4)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(128,65);ctx.bezierCurveTo(132,45,120,30,100,30);ctx.strokeStyle=col+'0.4)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(80,35);ctx.lineTo(120,35);ctx.strokeStyle=col+'0.5)';ctx.lineWidth=1.5;ctx.stroke();
  [{x:88,y1:48,y2:112,ph:0,amp:6},{x:96,y1:44,y2:116,ph:0.5,amp:7},{x:104,y1:44,y2:116,ph:1.0,amp:7},{x:112,y1:48,y2:112,ph:1.5,amp:6}].forEach(function(s){var vib=Math.sin(t*0.06+s.ph)*s.amp;ctx.beginPath();ctx.moveTo(s.x,s.y1);ctx.quadraticCurveTo(s.x+vib,(s.y1+s.y2)/2,s.x,s.y2);ctx.strokeStyle=col+'0.55)';ctx.lineWidth=0.8;ctx.stroke();});
  [[55,45,2.5],[148,52,3.2],[62,110,2.8],[142,105,2.0],[100,148,3.0]].forEach(function(s){var al=0.18+0.2*(Math.sin(t*0.04+s[2])*0.5+0.5);ctx.beginPath();ctx.arc(s[0],s[1],1,0,Math.PI*2);ctx.fillStyle=col+al+')';ctx.fill();});
}

function drawDarkness(ctx,t){
  var col='rgba(212,201,176,';
  ctx.beginPath();ctx.moveTo(30,128);ctx.lineTo(170,128);ctx.strokeStyle=col+'0.08)';ctx.lineWidth=0.5;ctx.stroke();
  var fy=Math.sin(t*0.025)*2;
  ctx.save();ctx.translate(0,fy);
  ctx.beginPath();ctx.arc(65,80,7,0,Math.PI*2);ctx.strokeStyle=col+'0.35)';ctx.lineWidth=1;ctx.stroke();
  [[65,87,65,115],[65,97,55,108],[65,97,75,108],[65,115,58,128],[65,115,72,128]].forEach(function(l){ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.strokeStyle=col+'0.32)';ctx.lineWidth=1;ctx.stroke();});
  ctx.restore();
  var fy2=Math.sin(t*0.022+0.5)*2;
  ctx.save();ctx.translate(0,fy2);ctx.globalAlpha=0.75;
  ctx.setLineDash([3,2]);ctx.beginPath();ctx.arc(135,80,7,0,Math.PI*2);ctx.strokeStyle=col+'0.28)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
  [[135,87,135,115],[135,97,125,108],[135,97,145,108],[135,115,128,128],[135,115,142,128]].forEach(function(l){ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.strokeStyle=col+'0.25)';ctx.lineWidth=1;ctx.stroke();});
  ctx.globalAlpha=1;ctx.restore();
  var melo=0.1+0.1*(Math.sin(t*0.03)*0.5+0.5);
  ctx.beginPath();ctx.moveTo(82,100);ctx.bezierCurveTo(90,95,110,105,118,100);ctx.strokeStyle=col+melo+')';ctx.lineWidth=0.8;ctx.stroke();
  [[40,50,3],[160,45,2.5],[100,35,3.5],[55,145,2.8],[155,140,3.2]].forEach(function(s){var al=0.15+0.2*(Math.sin(t*0.035+s[2])*0.5+0.5);ctx.beginPath();ctx.arc(s[0],s[1],1,0,Math.PI*2);ctx.fillStyle=col+al+')';ctx.fill();});
}

function drawWalk(ctx,t){
  var col='rgba(212,201,176,';
  ctx.beginPath();ctx.moveTo(20,130);ctx.quadraticCurveTo(100,125,180,130);ctx.strokeStyle=col+'0.1)';ctx.lineWidth=0.8;ctx.stroke();
  var fy=Math.sin(t*0.025)*2;
  ctx.save();ctx.translate(0,fy);
  ctx.beginPath();ctx.arc(75,82,7,0,Math.PI*2);ctx.strokeStyle=col+'0.4)';ctx.lineWidth=1;ctx.stroke();
  [[75,89,75,115],[75,98,65,110],[75,98,85,107],[75,115,68,130],[75,115,82,130]].forEach(function(l){ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.strokeStyle=col+'0.38)';ctx.lineWidth=1;ctx.stroke();});
  ctx.restore();
  var fy2=Math.sin(t*0.022+0.4)*1.5;
  ctx.save();ctx.translate(0,fy2);ctx.globalAlpha=0.7;
  ctx.setLineDash([2,2]);ctx.beginPath();ctx.arc(115,90,6,0,Math.PI*2);ctx.strokeStyle=col+'0.3)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
  [[115,96,115,118],[115,105,107,115],[115,105,123,115],[115,118,109,130],[115,118,121,130]].forEach(function(l){ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.strokeStyle=col+'0.25)';ctx.lineWidth=1;ctx.stroke();});
  ctx.globalAlpha=1;ctx.restore();
  var spark=0.4+0.4*(Math.sin(t*0.05)*0.5+0.5);
  ctx.beginPath();ctx.arc(95,86,1.5,0,Math.PI*2);ctx.fillStyle=col+spark+')';ctx.fill();
  [[0,-8],[6,-6],[8,0],[6,6],[-6,-6],[-8,0]].forEach(function(r,i){var a2=0.3+0.35*(Math.sin(t*0.05+i*0.4)*0.5+0.5);ctx.beginPath();ctx.moveTo(95,86);ctx.lineTo(95+r[0],86+r[1]);ctx.strokeStyle=col+a2+')';ctx.lineWidth=0.8;ctx.stroke();});
  [[30,40,4],[170,35,3.5],[100,25,5],[50,148,3.8],[155,145,4.2]].forEach(function(s){var al=0.12+0.2*(Math.sin(t*0.03+s[2])*0.5+0.5);ctx.beginPath();ctx.arc(s[0],s[1],1,0,Math.PI*2);ctx.fillStyle=col+al+')';ctx.fill();});
}

function drawEnd(ctx,t){
  var col='rgba(212,201,176,';
  var cStars=[[100,38],[88,52],[112,52],[85,65],[115,65]];
  [[0,1],[0,2],[1,3],[2,4],[3,4]].forEach(function(p){ctx.beginPath();ctx.moveTo(cStars[p[0]][0],cStars[p[0]][1]);ctx.lineTo(cStars[p[1]][0],cStars[p[1]][1]);ctx.strokeStyle=col+'0.12)';ctx.lineWidth=0.5;ctx.stroke();});
  cStars.forEach(function(s,i){var al=0.4+0.5*(Math.sin(t*0.04+i*0.8)*0.5+0.5);var r=i===0?1.8:1;ctx.beginPath();ctx.arc(s[0],s[1],r,0,Math.PI*2);ctx.fillStyle=col+al+')';ctx.fill();});
  var halo=0.1+0.15*(Math.sin(t*0.04)*0.5+0.5);ctx.beginPath();ctx.arc(100,38,5,0,Math.PI*2);ctx.strokeStyle=col+halo+')';ctx.lineWidth=0.5;ctx.stroke();
  var fy=Math.sin(t*0.02)*4;
  ctx.save();ctx.translate(0,fy);
  ctx.beginPath();ctx.arc(90,88,6,0,Math.PI*2);ctx.strokeStyle=col+'0.4)';ctx.lineWidth=1;ctx.stroke();
  [[90,94,90,118],[90,103,82,112],[90,103,97,110],[90,118,84,130],[90,118,96,130]].forEach(function(l){ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.strokeStyle=col+'0.38)';ctx.lineWidth=1;ctx.stroke();});
  ctx.setLineDash([2,1.5]);ctx.beginPath();ctx.arc(110,88,6,0,Math.PI*2);ctx.strokeStyle=col+'0.35)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
  [[110,94,110,118],[110,103,103,110],[110,103,118,112],[110,118,104,130],[110,118,116,130]].forEach(function(l){ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.strokeStyle=col+'0.28)';ctx.lineWidth=1;ctx.stroke();});
  ctx.beginPath();ctx.moveTo(97,110);ctx.lineTo(103,110);ctx.strokeStyle=col+'0.5)';ctx.lineWidth=1.2;ctx.stroke();
  ctx.restore();
  ctx.beginPath();ctx.moveTo(55,130);ctx.lineTo(145,130);ctx.strokeStyle=col+'0.08)';ctx.lineWidth=0.5;ctx.stroke();
  [[35,55,3.5],[165,48,2.8],[45,140,4],[158,138,3.2]].forEach(function(s){var al=0.1+0.18*(Math.sin(t*0.03+s[2])*0.5+0.5);ctx.beginPath();ctx.arc(s[0],s[1],0.8,0,Math.PI*2);ctx.fillStyle=col+al+')';ctx.fill();});
}

// Fin 2 — seul avec la lyre, elle est partie
function drawAlone(ctx,t){
  var col='rgba(212,201,176,';
  var glow=0.03+0.015*Math.sin(t*0.015);
  ctx.beginPath();ctx.ellipse(100,80,30,34,0,0,Math.PI*2);ctx.fillStyle=col+glow+')';ctx.fill();
  ctx.beginPath();ctx.moveTo(78,66);ctx.bezierCurveTo(70,80,70,98,78,102);ctx.bezierCurveTo(88,122,112,122,122,102);ctx.bezierCurveTo(130,98,130,80,122,66);ctx.strokeStyle=col+'0.28)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(80,70);ctx.bezierCurveTo(76,52,88,40,100,40);ctx.strokeStyle=col+'0.3)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(120,70);ctx.bezierCurveTo(124,52,112,40,100,40);ctx.strokeStyle=col+'0.3)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(88,42);ctx.lineTo(112,42);ctx.strokeStyle=col+'0.4)';ctx.lineWidth=1.5;ctx.stroke();
  // cordes qui ne vibrent presque plus
  [{x:92,y1:54,y2:108,ph:0,amp:1.5},{x:100,y1:50,y2:112,ph:0.5,amp:1},{x:108,y1:54,y2:108,ph:1,amp:1.5}].forEach(function(s){var vib=Math.sin(t*0.025+s.ph)*s.amp;ctx.beginPath();ctx.moveTo(s.x,s.y1);ctx.quadraticCurveTo(s.x+vib,(s.y1+s.y2)/2,s.x,s.y2);ctx.strokeStyle=col+'0.3)';ctx.lineWidth=0.7;ctx.stroke();});
  // silhouette assise seule, voûtée
  ctx.beginPath();ctx.arc(100,32,5,0,Math.PI*2);ctx.strokeStyle=col+'0.22)';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.moveTo(100,37);ctx.bezierCurveTo(98,48,95,55,98,65);ctx.strokeStyle=col+'0.22)';ctx.lineWidth=1;ctx.stroke();
  // étoiles qui s'éteignent
  [[45,40,2],[158,35,3],[70,130,2.5],[135,128,3.5],[100,150,4]].forEach(function(s){var al=0.05+0.1*(Math.sin(t*0.025+s[2])*0.5+0.5);ctx.beginPath();ctx.arc(s[0],s[1],0.8,0,Math.PI*2);ctx.fillStyle=col+al+')';ctx.fill();});
}

// Fin 3 — elle seule, remonte
function drawFree(ctx,t){
  var col='rgba(212,201,176,';
  ctx.beginPath();ctx.moveTo(40,130);ctx.quadraticCurveTo(100,124,170,130);ctx.strokeStyle=col+'0.1)';ctx.lineWidth=0.8;ctx.stroke();
  // Elle seule, silhouette féminine, marche vers la lumière
  var fy=Math.sin(t*0.022)*2;
  ctx.save();ctx.translate(0,fy);
  ctx.setLineDash([2,1.5]);ctx.beginPath();ctx.arc(100,82,7,0,Math.PI*2);ctx.strokeStyle=col+'0.4)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
  [[100,89,100,115],[100,98,90,110],[100,98,110,110],[100,115,93,130],[100,115,107,130]].forEach(function(l){ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.strokeStyle=col+'0.35)';ctx.lineWidth=1;ctx.stroke();});
  // cheveux longs
  ctx.beginPath();ctx.moveTo(94,82);ctx.bezierCurveTo(90,92,91,104,93,115);ctx.strokeStyle=col+'0.2)';ctx.lineWidth=0.8;ctx.stroke();
  ctx.beginPath();ctx.moveTo(92,84);ctx.bezierCurveTo(87,96,89,108,91,118);ctx.strokeStyle=col+'0.12)';ctx.lineWidth=0.6;ctx.stroke();
  ctx.restore();
  // Lumière devant elle
  var lum=0.06+0.08*(Math.sin(t*0.03)*0.5+0.5);

function drawTogether(ctx,t){
  var col='rgba(212,201,176,';

  // cheveux

// Fin 5 — lyre brisée, silence
function drawSilence(ctx,t){
  var col='rgba(212,201,176,';

  ctx.beginPath();ctx.moveTo(128,65);ctx.lineTo(118,50);ctx.strokeStyle=col+'0.15)';ctx.lineWidth=1;ctx.stroke();
  // cordes pendantes
  [{x:88,drop:20},{x:96,drop:35},{x:104,drop:28},{x:112,drop:15}].forEach(function(s){ctx.beginPath();ctx.moveTo(s.x,50);ctx.lineTo(s.x+Math.sin(t*0.02)*2,50+s.drop);ctx.strokeStyle=col+'0.2)';ctx.lineWidth=0.7;ctx.stroke();});
  // sol
  ctx.beginPath();ctx.moveTo(50,130);ctx.lineTo(150,130);ctx.strokeStyle=col+'0.07)';ctx.lineWidth=0.5;ctx.stroke();
  // fragment tombé
  ctx.beginPath();ctx.moveTo(80,130);ctx.bezierCurveTo(75,118,85,112,90,120);ctx.strokeStyle=col+'0.15)';ctx.lineWidth=1;ctx.stroke();

  [[40,35,2],[160,40,3],[100,25,2.5],[55,145,3],[148,138,2]].forEach(function(s){var al=0.03+0.05*(Math.sin(t*0.015+s[2])*0.5+0.5);ctx.beginPath();ctx.arc(s[0],s[1],0.8,0,Math.PI*2);ctx.fillStyle=col+al+')';ctx.fill();});
}

// ── ENGINE ──
var illustEl=document.getElementById('illustration');
var actTag=document.getElementById('act-tag');
var narration=document.getElementById('narration');
var choicesEl=document.getElementById('choices');
var endingEl=document.getElementById('ending');
var endingCanvas=document.getElementById('ending-canvas');
var endLabel=document.getElementById('ending-label');
var endType=document.getElementById('ending-type');
var endTitle=document.getElementById('ending-title');
var endText=document.getElementById('ending-text');
var scorePanel=document.getElementById('score-panel');
var whyBtn=document.getElementById('why-btn');
var restartBtn=document.getElementById('restart-btn');
var currentIllus=null;
var endLoopActive=false;
var currentEndKey='end_light';

function showScene(key){
  var isEnd=key.indexOf('end_')===0;
  if(isEnd){showEnding(key);return;}
  var scene=scenes[key];if(!scene)return;
  illustEl.classList.remove('show');
  narration.classList.remove('show');
  choicesEl.classList.remove('show');
  setTimeout(function(){
    actTag.innerHTML=scene.act;
    if(currentIllus&&currentIllus._stop)currentIllus._stop();
    illustEl.innerHTML='';
    if(scene.canvas&&drawFns[scene.canvas]){currentIllus=makeCanvas(drawFns[scene.canvas]);illustEl.appendChild(currentIllus);}
    narration.innerHTML=scene.text;
    choicesEl.innerHTML='';
    scene.choices.forEach(function(c){
      var btn=document.createElement('button');btn.className='choice-btn';btn.innerHTML=c.label;
      btn.addEventListener('click',function(){
        if(c.sc){Object.keys(c.sc).forEach(function(k){score[k]=(score[k]||0)+c.sc[k];});}
        illustEl.classList.remove('show');narration.classList.remove('show');choicesEl.classList.remove('show');
        setTimeout(function(){showScene(c.next);},450);
      });
      choicesEl.appendChild(btn);
    });
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      illustEl.classList.add('show');narration.classList.add('show');choicesEl.classList.add('show');
    });});
  },480);
}

function computeEnding(){
  // Logique des fins basée sur le score accumulé
  var c=score.courage,f=score.confiance,l=score.lacher;
  var total=c+f+l;
  // Fin silence : très peu de tout
  if(total<=1)return'end_silence';
  // Fin together : lacher élevé
  if(l>=2&&c<=1)return'end_together';
  // Fin free : lacher élevé + courage
  if(l>=2&&c>=1)return'end_free';
  // Fin alone : courage bas, confiance basse
  if(c<=1&&f<=1&&total<=3)return'end_alone';
  // Fin light : courage + confiance élevés
  return'end_light';
}

function showEnding(key){
  if(!key)key=computeEnding();
  currentEndKey=key;
  var e=endings[key];
  illustEl.classList.remove('show');narration.classList.remove('show');choicesEl.classList.remove('show');
  setTimeout(function(){
    if(currentIllus&&currentIllus._stop)currentIllus._stop();
    endLoopActive=true;
    var t=0;var ctx2=endingCanvas.getContext('2d');
    var fn=drawFns[scenes[key]?scenes[key].canvas:key.replace('end_','')] || drawEnd;
    // map ending key to draw function
    var endDrawMap={end_light:drawEnd,end_alone:drawAlone,end_free:drawFree,end_together:drawTogether,end_silence:drawSilence};
    var drawFn2=endDrawMap[key]||drawEnd;
    function loopEnd(){if(!endLoopActive)return;ctx2.clearRect(0,0,200,160);drawFn2(ctx2,t);t++;requestAnimationFrame(loopEnd);}
    loopEnd();
    endLabel.textContent=e.label;
    endType.innerHTML=e.type;
    endTitle.innerHTML=e.title;
    endText.innerHTML=e.text;
    scorePanel.classList.remove('show');
    endingEl.style.display='block';
    requestAnimationFrame(function(){requestAnimationFrame(function(){endingEl.classList.add('show');});});
  },500);
}

whyBtn.addEventListener('click',function(){
  var e=endings[currentEndKey];
  var maxC=maxScore.courage,maxF=maxScore.confiance,maxL=maxScore.lacher;
  document.getElementById('bar-courage').style.width=Math.min(100,Math.round(score.courage/maxC*100))+'%';
  document.getElementById('bar-confiance').style.width=Math.min(100,Math.round(score.confiance/maxF*100))+'%';
  document.getElementById('bar-lacher').style.width=Math.min(100,Math.round(score.lacher/maxL*100))+'%';
  document.getElementById('val-courage').textContent=score.courage+' / '+maxC;
  document.getElementById('val-confiance').textContent=score.confiance+' / '+maxF;
  document.getElementById('val-lacher').textContent=score.lacher+' / '+maxL;
  document.getElementById('score-philosophy').innerHTML=e.philosophy;
  scorePanel.classList.add('show');
  whyBtn.style.display='none';
});

restartBtn.addEventListener('click',function(){
  endLoopActive=false;score={courage:0,confiance:0,lacher:0};
  endingEl.classList.remove('show');scorePanel.classList.remove('show');whyBtn.style.display='';
  setTimeout(function(){endingEl.style.display='none';showScene('intro');},600);
});

showScene('intro');
</script>
